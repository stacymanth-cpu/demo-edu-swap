# Render's free plan puts the EduSwap server to sleep after 15 minutes without requests, and
# students cannot sign in until it wakes (up to a minute). This calls /healthz every 10 minutes.
# Set the repository variable PIN_SERVER_URL (Settings > Secrets and variables > Actions >
# Variables), for example https://eduswap-pin-server.onrender.com. Until then it does nothing.
name: Keep the EduSwap server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /healthz
        env:
          PIN_SERVER_URL: ${{ vars.PIN_SERVER_URL }}
        run: |
          if [ -z "$PIN_SERVER_URL" ]; then
            echo "PIN_SERVER_URL is not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "${PIN_SERVER_URL%/}/healthz"
